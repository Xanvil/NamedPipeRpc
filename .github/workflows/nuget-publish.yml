# 发布 NamedPipeRpc 到 nuget.org（Trusted Publishing / OIDC）
#
# nuget.org Trusted Publishing 策略请填写：
#   Repository Owner = GitHub 用户或组织名
#   Repository       = NamedPipeRpc（或你的实际仓库名）
#   Workflow File    = nuget-publish.yml   ← 只要文件名，不要带路径
#   Environment      = 留空（本 workflow 未使用 environment:）
#
# GitHub 仓库需配置 Secret：
#   NUGET_USER = nuget.org 个人资料用户名（不是邮箱）
#
# 触发：
#   - 推送 tag：v1.0.0 / v1.2.3-preview.1 等
#   - Actions 页手动运行（可填版本号；留空则用 Directory.Build.props 的 Version）

name: Publish NuGet

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: '包版本（手动运行时可选；留空则用 Directory.Build.props）'
        required: false
        type: string

jobs:
  publish:
    runs-on: windows-latest
    permissions:
      id-token: write   # Trusted Publishing：向 nuget.org 换取短期 API Key
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          # net8.0 目标 + SDK 打包；net472 由 Windows 宿主提供引用程序集
          dotnet-version: '8.0.x'

      - name: Resolve package version
        id: ver
        shell: pwsh
        run: |
          if ("${{ github.event_name }}" -eq "workflow_dispatch" -and "${{ inputs.version }}".Trim()) {
            $v = "${{ inputs.version }}".Trim().TrimStart('v', 'V')
          }
          elseif ("${{ github.ref_type }}" -eq "tag") {
            $v = "${{ github.ref_name }}".TrimStart('v', 'V')
          }
          else {
            # 手动运行且未填版本：读 Directory.Build.props 中的 <Version>
            [xml]$props = Get-Content Directory.Build.props
            $v = $props.Project.PropertyGroup.Version
            if (-not $v) { throw "无法从 Directory.Build.props 解析 Version，请在手动运行时填写 version。" }
          }
          if ($v -notmatch '^\d+(\.\d+){1,3}([-.].*)?$') {
            throw "无效版本号: $v（期望如 1.0.0 或 1.0.0-preview.1）"
          }
          Write-Host "Package version = $v"
          "VERSION=$v" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8

      - name: Pack
        run: |
          dotnet pack NamedPipeRpc/NamedPipeRpc.csproj `
            -c Release `
            -o artifacts/nuget `
            -p:Version=${{ steps.ver.outputs.VERSION }} `
            -p:PackageVersion=${{ steps.ver.outputs.VERSION }}

      - name: Upload nupkg artifact
        uses: actions/upload-artifact@v4
        with:
          name: nuget-NamedPipeRpc-${{ steps.ver.outputs.VERSION }}
          path: artifacts/nuget/*.nupkg
          if-no-files-found: error

      # OIDC → nuget.org 短期 API Key（勿在仓库中存放长期 NUGET_API_KEY）
      - name: NuGet login (Trusted Publishing)
        id: login
        uses: NuGet/login@v1
        with:
          user: ${{ secrets.NUGET_USER }}

      - name: Push to nuget.org
        run: |
          dotnet nuget push artifacts/nuget/*.nupkg `
            --api-key ${{ steps.login.outputs.NUGET_API_KEY }} `
            --source https://api.nuget.org/v3/index.json `
            --skip-duplicate
